version: 2.1

commands:
  prepare-build:
    steps:
      - run:
          name: Install matching LLVM tools and development headers
          command: |
            curl --fail --silent --show-error --location \
              https://apt.llvm.org/llvm-snapshot.gpg.key \
              | sudo tee /usr/share/keyrings/apt.llvm.org.asc > /dev/null
            echo 'deb [signed-by=/usr/share/keyrings/apt.llvm.org.asc] https://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main' \
              | sudo tee /etc/apt/sources.list.d/llvm-23.list
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends \
              build-essential pkg-config nodejs python3 \
              clang-23 llvm-23 llvm-23-dev lld-23 libclang-rt-23-dev
            echo 'export PATH="$HOME/.cargo/bin:$HOME/.local/solar-ci/bin:/usr/lib/llvm-23/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install the pinned Rust toolchain
          command: |
            if ! command -v rustup > /dev/null; then
              curl --fail --silent --show-error --location https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            fi
            rustup toolchain install "$(cat rust-toolchain)" --profile minimal
      - restore_cache:
          keys:
            - v1-solar-tools-{{ arch }}-{{ checksum "rust-toolchain" }}-{{ checksum ".circleci/config.yml" }}
      - run:
          name: Install nextest and the tree-sitter CLI
          command: |
            cargo install --locked --root "$HOME/.local/solar-ci" \
              --version 0.9.143 cargo-nextest
            cargo install --locked --root "$HOME/.local/solar-ci" \
              --version 0.25.6 tree-sitter-cli
      - save_cache:
          key: v1-solar-tools-{{ arch }}-{{ checksum "rust-toolchain" }}-{{ checksum ".circleci/config.yml" }}
          paths:
            - ~/.local/solar-ci
      - restore_cache:
          keys:
            - v1-solar-cargo-{{ arch }}-{{ checksum "Cargo.lock" }}
            - v1-solar-cargo-{{ arch }}-
  save-cargo-downloads:
    steps:
      - save_cache:
          key: v1-solar-cargo-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git

jobs:
  build:
    machine:
      image: ubuntu-2604:current
    resource_class: large
    environment:
      CARGO_TERM_COLOR: always
    steps:
      - checkout
      - prepare-build
      - run:
          name: Check benchmark report generation
          command: python3 -m unittest discover -s bench -p test_ci_report.py
      - run:
          name: Run workspace tests
          command: cargo nextest run --workspace
      - save-cargo-downloads

  benchmarks:
    machine:
      image: ubuntu-2604:current
    resource_class: 2xlarge
    environment:
      CARGO_TERM_COLOR: always
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - checkout
      - prepare-build
      - run:
          name: Install benchmark runtimes and allocators
          command: bash .circleci/install-bench-tools.sh
      - run:
          name: Build the complete benchmark suite in release mode
          no_output_timeout: 30m
          command: |
            mkdir -p target/benchmark-results
            bash bench/build.sh 2>&1 | tee target/benchmark-results/build.log
      - save-cargo-downloads
      - run:
          name: Run benchmarks and produce the report
          no_output_timeout: 30m
          command: python3 bench/ci_report.py
      - store_artifacts:
          path: target/benchmark-results
          destination: benchmarks

workflows:
  build-and-test:
    jobs:
      - build
      - benchmarks
